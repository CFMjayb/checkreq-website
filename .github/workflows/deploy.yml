name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION:  us-east1
  SERVICE: checkreq-website-dev
  IMAGE:   us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/checkreq-website/checkreq-website-dev

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROJECT_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # -- Deploy to Cloud Run --------------------------------------------------
      # Dev environment for the 26-129 check-request website (see
      # "GCP Dev Server Deploy Plan.md" in the project working folder).
      # Reuses qbo-mcp-sa (already has Cloud SQL client + project-wide Secret
      # Manager read + the cfm-checkreq-attachments bucket grant) rather than a
      # new dedicated service account.
      #
      # AZURE_REDIRECT_URI/GOOGLE_REDIRECT_URI point at the real custom
      # domain (beacondev.cfmins.org, live since 2026-08-16), not the raw
      # Cloud Run *.run.app hostname. REAL INCIDENT, same day: this line
      # originally hardcoded the raw hostname from before the custom domain
      # existed; a session then fixed the live service's env vars by hand
      # via `gcloud run services update --update-env-vars`, not realizing
      # `gcloud run deploy --set-env-vars` here REPLACES the entire env var
      # set on every single push -- every subsequent code deploy silently
      # reverted the redirect URIs back to the stale raw-hostname value,
      # reproducing "Login state mismatch" / landing on the old URL after
      # login, repeatedly, with no code change responsible. Any future
      # `gcloud run services update` env-var patch to this service will be
      # wiped out the same way on the next push -- always fix it HERE
      # instead, so it survives every deploy.
      #
      # checkreq-azure-credentials / sharepoint-credentials / anthropic-api-key
      # are read live via the Secret Manager API client inside the app itself
      # (auth_azure.py / sharepoint_client.py / document_extract.py), not
      # injected as env vars -- qbo-mcp-sa's project-level secretAccessor grant
      # covers them, nothing to add here.
      # --memory/--cpu raised 2026-07-26 (512Mi/1 -> 1Gi/2): confirmed OOM-kill
      # of the container observed peaking at 550-559 MiB right as the
      # Playwright/headless-Chromium PDF renderer (_html_to_pdf_bytes() in
      # main.py) launches its Chromium subprocess -- caused "Service
      # Unavailable" on /requests/{id}/pdf. Not a Chromium bug, not a
      # timeout -- purely a memory ceiling. 2 CPU also given since Chromium
      # launch is CPU-heavy and Cloud Run ties CPU tier to memory tier.
      # Prior 512Mi/1 config preserved in deploy_pre_pdf_oom_memory_fix.yml.bak
      # in this same folder (note the .bak extension -- required so GitHub
      # Actions doesn't also treat it as a second live workflow).
      #
      # H6 identity split (2026-09-19, Security Assessment 2026-09-19.md):
      # GCP_PROJECT_SERVICE_ACCOUNT_EMAIL now holds beacon-deploy-sa (the CI/
      # deploy identity WIF impersonates in the "Authenticate to GCP" step
      # above -- run.developer + artifactregistry.writer + serviceAccountUser
      # on beacon-runtime-sa only, nothing project-wide). The runtime identity
      # actually assigned to the SERVICE below is now hardcoded to
      # beacon-runtime-sa, not read from that same secret -- these two
      # identities are deliberately no longer the same principal (qbo-mcp-sa
      # used to be both at once: the runtime SA for 5 unrelated services AND
      # the CI identity AND held project-wide Secret Manager read). Do not
      # revert this to ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }} --
      # that would silently re-widen the runtime identity back to whatever
      # the deploy secret holds. Old qbo-mcp-sa bindings intentionally left
      # in place for a few days of parallel operation before being trimmed.
      #
      # H7 database role cutover (2026-09-20, Security Assessment
      # 2026-09-19.md): PGUSER/PGPASSWORD switched from the shared `postgres`
      # superuser to the dedicated, least-privilege `beacon_app_dev` role
      # (CONNECT + USAGE/DML on checkreq+portal only, plus the one narrow
      # cross-database SELECT on cfmqbo.public.fund_account_masks -- see
      # H7's own status entry in the assessment for why that table stays
      # shared). beacon_app_dev cannot read or write cfmqbo_prod at all, so a
      # bug in this dev service can no longer touch production data -- the
      # exact gap H7 exists to close. beacon-runtime-sa was granted
      # secretAccessor on the new beacon-db-password-dev secret before this
      # change shipped (2026-09-20). Old config preserved in
      # deploy.yml.pre_h7_db_role_cutover.bak in this same folder.
      #
      # M17 timeout raise (2026-09-21, Security Assessment 2026-09-19.md):
      # --timeout 30 was the confirmed root cause of the hourly vendor-sync
      # job's recurring 504s -- sync_vendors_now() (all 4 companies, one HTTP
      # request) regularly ran longer than 30s; real Cloud Run logs show
      # frequent 30.000s timeouts and one real successful completion at
      # 118s. Raised to 300 (Cloud Run's own per-request ceiling for a
      # synchronous HTTP service) rather than a smaller number, since real
      # data already exceeds the handoff doc's own example test value of
      # ~90s. Prior 30s config preserved in
      # deploy.yml.pre_m17_timeout_fix.bak in this same folder.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image                  $IMAGE:${{ github.sha }} \
            --region                 $REGION \
            --platform               managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE }}" \
            --set-env-vars           "INSTANCE_CONNECTION_NAME=${{ secrets.CLOUDSQL_INSTANCE }},PGUSER=beacon_app_dev,PGDATABASE=cfmqbo,FIRESTORE_PROJECT=${{ secrets.GCP_PROJECT_ID }},AZURE_REDIRECT_URI=https://beacondev.cfmins.org/auth/callback,GOOGLE_REDIRECT_URI=https://beacondev.cfmins.org/auth/google/callback" \
            --set-secrets            "PGPASSWORD=beacon-db-password-dev:latest,SESSION_SECRET=checkreq-session-secret:latest" \
            --service-account        beacon-runtime-sa@cfm-qbo-mcp.iam.gserviceaccount.com \
            --memory                 1Gi \
            --cpu                    2 \
            --timeout                300 \
            --min-instances          0 \
            --max-instances          2 \
            --port                   8080

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe $SERVICE \
                  --region $REGION \
                  --format 'value(status.url)')
          echo "Service URL: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Deployment healthy."
