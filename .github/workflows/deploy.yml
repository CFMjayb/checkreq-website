name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION:  us-east1
  SERVICE: checkreq-website-dev
  IMAGE:   us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/checkreq-website/checkreq-website-dev

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROJECT_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # -- Deploy to Cloud Run --------------------------------------------------
      # Dev environment for the 26-129 check-request website (see
      # "GCP Dev Server Deploy Plan.md" in the project working folder).
      # Reuses qbo-mcp-sa (already has Cloud SQL client + project-wide Secret
      # Manager read + the cfm-checkreq-attachments bucket grant) rather than a
      # new dedicated service account.
      #
      # AZURE_REDIRECT_URI is intentionally omitted from the first deploy --
      # the real Cloud Run URL isn't known until after it. main.py falls back
      # to the localhost default in the meantime, which is harmless since no
      # real login can complete against it yet anyway. Once the URL is known
      # (from this workflow's own Smoke test step output, or
      # `gcloud run services describe checkreq-website-dev --region us-east1
      # --format 'value(status.url)'`), add
      # ",AZURE_REDIRECT_URI=<real-url>/auth/callback" to the --set-env-vars
      # line below and push again -- it's a URL, not a credential, so a plain
      # env var edit here is correct, not a new secret.
      #
      # checkreq-azure-credentials / sharepoint-credentials / anthropic-api-key
      # are read live via the Secret Manager API client inside the app itself
      # (auth_azure.py / sharepoint_client.py / document_extract.py), not
      # injected as env vars -- qbo-mcp-sa's project-level secretAccessor grant
      # covers them, nothing to add here.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image                  $IMAGE:${{ github.sha }} \
            --region                 $REGION \
            --platform               managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE }}" \
            --set-env-vars           "INSTANCE_CONNECTION_NAME=${{ secrets.CLOUDSQL_INSTANCE }},PGUSER=postgres,PGDATABASE=cfmqbo,FIRESTORE_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --set-secrets            "PGPASSWORD=pg-password:latest,SESSION_SECRET=checkreq-session-secret:latest" \
            --service-account        ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }} \
            --memory                 512Mi \
            --cpu                    1 \
            --timeout                30 \
            --min-instances          0 \
            --max-instances          2 \
            --port                   8080

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe $SERVICE \
                  --region $REGION \
                  --format 'value(status.url)')
          echo "Service URL: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Deployment healthy."
