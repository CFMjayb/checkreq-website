name: Build & Deploy to Cloud Run (Production)

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGION:  us-east1
  SERVICE: checkreq-website
  IMAGE:   us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/checkreq-website/checkreq-website

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROJECT_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # -- Deploy to Cloud Run (PRODUCTION) --------------------------------------
      # Per Dev-Prod Split Plan.md (2026-07-31, all 7 decisions Jay-approved).
      # Same Cloud SQL INSTANCE as dev, but a SEPARATE database (cfmqbo_prod) --
      # db.py already reads the database name from PGDATABASE, so this needed
      # zero application-code changes; a schema-only split would have meant
      # rewriting the hundreds of literal "checkreq." references throughout
      # main.py/checkreq_api.py instead. Reuses qbo-mcp-sa (same runtime
      # identity as dev -- no new service account, per the plan).
      #
      # BEACON_ENV=prod is the one line that flips every dev-only safeguard
      # off: the red "DEV ENVIRONMENT" banner, the QBO-posting confirmation
      # dialog, and Test Mode's ability to be enabled at all (see main.py's
      # BEACON_ENV constant and email_client.py's _apply_test_mode() for
      # where each of those checks lives). NEVER remove this line or let a
      # future env-var patch here silently drop it -- unlike dev, production
      # needs NONE of those dev-only guards, and their absence here is
      # exactly what makes this deploy block "production," not a second dev.
      #
      # AZURE_REDIRECT_URI/GOOGLE_REDIRECT_URI point at the real production
      # custom domain (beacon.cfmins.org) -- these must be added to the
      # Azure AD app registration's redirect URIs and the Google OAuth 2.0
      # Client's authorized redirect URIs (both additive alongside the
      # existing dev entries) before a real login can succeed here.
      #
      # SSO_AUTO_HOSTNAME=beacon.episcopalmaryland.org (added 2026-08-27,
      # Jay: "when people access our beacon with beacon.episcopalmaryland.org,
      # it uses the SSO that is auth'd for that domain") -- auth_routes.py's
      # login_page()/_microsoft_redirect_uri() are both inert everywhere this
      # env var is unset (confirmed live on dev before promoting), so leaving
      # it here permanently is safe even before the domain mapping/DNS exist.
      # https://beacon.episcopalmaryland.org/auth/callback must ALSO be a
      # registered redirect URI on the same Azure AD app registration
      # (client id a7f89cbd-0d41-457d-a090-ee367fda4f65, tenant cfmins.org)
      # -- done 2026-08-27. This is --set-env-vars (replaces the whole list
      # every deploy, not additive) -- a future edit here that drops this key
      # would silently re-break the EDOM-branded hostname's auto-SSO, same
      # class of mistake the BEACON_ENV=prod comment above already warns about.
      #
      # checkreq-azure-credentials / sharepoint-credentials / anthropic-api-key
      # are read live via the Secret Manager API client inside the app itself,
      # not injected as env vars here -- same as dev, no change needed.
      #
      # H6 identity split (2026-09-19, Security Assessment 2026-09-19.md):
      # GCP_PROJECT_SERVICE_ACCOUNT_EMAIL now holds beacon-deploy-sa (the CI/
      # deploy identity WIF impersonates in the "Authenticate to GCP" step
      # above -- run.developer + artifactregistry.writer + serviceAccountUser
      # on beacon-runtime-sa only, nothing project-wide). The runtime identity
      # actually assigned to the SERVICE below is now hardcoded to
      # beacon-runtime-sa, not read from that same secret -- these two
      # identities are deliberately no longer the same principal (qbo-mcp-sa
      # used to be both at once: the runtime SA for 5 unrelated services AND
      # the CI identity AND held project-wide Secret Manager read). Do not
      # revert this to ${{ secrets.GCP_PROJECT_SERVICE_ACCOUNT_EMAIL }} --
      # that would silently re-widen the runtime identity back to whatever
      # the deploy secret holds. Old qbo-mcp-sa bindings intentionally left
      # in place for a few days of parallel operation before being trimmed.
      #
      # H7 database role cutover (2026-09-21, promoted from dev the same
      # night dev's own cutover was fixed -- see Security Assessment
      # 2026-09-19.md and 26-129's own CLAUDE.md "RESOLVED 2026-09-21" entry
      # for the full incident). PGUSER/PGPASSWORD switched from the shared
      # `postgres` superuser to the dedicated, least-privilege `beacon_app_prod`
      # role (CONNECT + USAGE/DML on checkreq+portal only, plus the one narrow
      # cross-database SELECT on cfmqbo.public.fund_account_masks -- same
      # design as dev's beacon_app_dev). beacon_app_prod cannot touch dev's
      # `cfmqbo` database at all, closing the exact gap H7 exists for.
      # beacon-runtime-sa already holds secretAccessor on beacon-db-password-
      # prod. IMPORTANT: this secret's value was regenerated 2026-09-21 via a
      # pure-Python generator and independently verified byte-for-byte via the
      # Secret Manager API client (not the gcloud CLI) before this change
      # shipped -- the original 2026-09-19 version of this secret carried a
      # hidden trailing \r\n that would have reproduced dev's multi-hour
      # "password authentication failed" outage, live, on production. See
      # feedback_secret_generation_gitbash_cr_bug memory before ever
      # regenerating a secret this way again. Old config preserved in
      # deploy-prod.yml.pre_h7_db_role_cutover.bak in this same folder.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image                  $IMAGE:${{ github.sha }} \
            --region                 $REGION \
            --platform               managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUDSQL_INSTANCE }}" \
            --set-env-vars           "INSTANCE_CONNECTION_NAME=${{ secrets.CLOUDSQL_INSTANCE }},PGUSER=beacon_app_prod,PGDATABASE=cfmqbo_prod,FIRESTORE_PROJECT=${{ secrets.GCP_PROJECT_ID }},BEACON_ENV=prod,AZURE_REDIRECT_URI=https://beacon.cfmins.org/auth/callback,GOOGLE_REDIRECT_URI=https://beacon.cfmins.org/auth/google/callback,SSO_AUTO_HOSTNAME=beacon.episcopalmaryland.org" \
            --set-secrets            "PGPASSWORD=beacon-db-password-prod:latest,SESSION_SECRET=checkreq-session-secret-prod:latest" \
            --service-account        beacon-runtime-sa@cfm-qbo-mcp.iam.gserviceaccount.com \
            --memory                 1Gi \
            --cpu                    2 \
            --timeout                30 \
            --min-instances          1 \
            --max-instances          2 \
            --port                   8080

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe $SERVICE \
                  --region $REGION \
                  --format 'value(status.url)')
          echo "Service URL: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed!"
            exit 1
          fi
          echo "Deployment healthy."
