{# Yes/No input. Context: q, field, selected. #}
<label class="poll-choice"><input type="radio" name="{{ field }}" value="yes" {{ "checked" if selected == "yes" }}> <span>{{ q.config.yes_label or "Yes" }}</span></label>
<label class="poll-choice"><input type="radio" name="{{ field }}" value="no" {{ "checked" if selected == "no" }}> <span>{{ q.config.no_label or "No" }}</span></label>
